ERA5 :
  type : anemoi
  # filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2022-6h-v6.zarr']
  filenames : ['aifs-ea-an-oper-0001-mars-o96-1979-2022-6h-v7-ml137.zarr']
  
  # source : ['u_', 'v_', '10u', '10v']
  # target : ['10u', '10v']
  source_exclude : ['w_', 'skt', 'tcw', 'cp', 'tp'] 
  target_exclude : ['w_', 'slor', 'sdor', 'tcw', 'cp', 'tp'] 

  #temporary variables to reduce datset size
  source_levels: [48, 60, 68, 74, 79, 83, 90, 95, 100, 105, 114, 120, 133] 
  target_levels: [48, 60, 68, 74, 79, 83, 90, 95, 100, 105, 114, 120, 133] 
  source_level_every: 4
  # target_level_every: 6 

  loss_weight : 1.
  masking_rate : 0.6
  masking_rate_none : 0.05
  token_size : 8
  tokenize_spacetime : True
  max_num_targets: -1
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 256
    num_blocks : 2
    use_perceiver: True
    cross_attention : 
      num_queries : 64 
      num_heads : 8 
  embed_target_coords :
    net : linear
    dim_embed : 256
  target_readout :
    type : 'obs_value'  # token or obs_value
    num_layers : 2
    num_heads : 4
    # sampling_rate : 0.2
  pred_head :
    ens_size : 1
    num_layers : 1
